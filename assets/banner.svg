<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accent-emerald" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-soft" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="25"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".25"/></pattern><style>@keyframes floatOrb{0%{transform:translate(0,0) scale(1)}}@keyframes barGrow1{0%{height:45px;y:155px}}@keyframes barGrow2{0%{height:75px;y:125px}}@keyframes barGrow3{0%{height:110px;y:90px}}@keyframes badgePulse{0%{opacity:.75;transform:scale(1)}}.orb-1{animation:floatOrb 10s ease-in-out infinite alternate}.orb-2{animation:floatOrb 14s ease-in-out infinite alternate-reverse}.pulse-line{stroke-dasharray:8 12;animation:dashMove 20s linear infinite}.metric-bar-1{animation:barGrow1 4s ease-in-out infinite alternate}.metric-bar-2{animation:barGrow2 4s ease-in-out infinite alternate .5s}.metric-bar-3{animation:barGrow3 4s ease-in-out infinite alternate 1s}.badge-glow{animation:badgePulse 3s ease-in-out infinite alternate}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="orb-1" filter="url(#glow-soft)" opacity=".45"><circle cx="150" cy="100" r="140" fill="#0284c7"/></g><g class="orb-2" filter="url(#glow-soft)" opacity=".35"><circle cx="1020" cy="280" r="160" fill="#6366f1"/></g><g filter="url(#glow-soft)" opacity=".25"><circle cx="650" cy="380" r="130" fill="#0d9488"/></g><g opacity=".3"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 0 320 Q 300 240 600 300 T 1200 220" class="pulse-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 0 350 Q 320 380 640 280 T 1200 310" class="pulse-line"/></g><g opacity=".95" transform="translate(860, 60)"><rect width="280" height="290" x="0" y="0" fill="#0f172a" fill-opacity=".85" stroke="#334155" stroke-width="1.5" rx="14"/><rect width="280" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".8" rx="14"/><circle cx="20" cy="19" r="5" fill="#ef4444"/><circle cx="36" cy="19" r="5" fill="#eab308"/><circle cx="52" cy="19" r="5" fill="#10b981"/><text x="80" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CONTRACT VELOCITY</text><g transform="translate(18, 55)"><rect width="244" height="60" fill="#1e293b" fill-opacity=".6" stroke="#475569" stroke-width=".8" rx="8"/><text x="14" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">AVG CYCLE TIME (TAT)</text><text x="14" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">14.2 Days</text><text x="155" y="48" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">