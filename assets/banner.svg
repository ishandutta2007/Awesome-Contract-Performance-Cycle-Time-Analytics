<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- CSS Animation Styles -->
    <style>
      .orb-1 {
        animation: floatOrb 10s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb 14s ease-in-out infinite alternate-reverse;
      }
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: dashMove 20s linear infinite;
      }
      .metric-bar-1 {
        animation: barGrow1 4s ease-in-out infinite alternate;
      }
      .metric-bar-2 {
        animation: barGrow2 4s ease-in-out infinite alternate 0.5s;
      }
      .metric-bar-3 {
        animation: barGrow3 4s ease-in-out infinite alternate 1s;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, -25px) scale(1.15); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes barGrow1 {
        0% { height: 45px; y: 155px; }
        100% { height: 95px; y: 105px; }
      }
      @keyframes barGrow2 {
        0% { height: 75px; y: 125px; }
        100% { height: 130px; y: 70px; }
      }
      @keyframes barGrow3 {
        0% { height: 110px; y: 90px; }
        100% { height: 60px; y: 140px; }
      }
      @keyframes badgePulse {
        0% { opacity: 0.75; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.03); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-1" filter="url(#glow-soft)" opacity="0.45">
    <circle cx="150" cy="100" r="140" fill="#0284c7" />
  </g>
  <g class="orb-2" filter="url(#glow-soft)" opacity="0.35">
    <circle cx="1020" cy="280" r="160" fill="#6366f1" />
  </g>
  <g filter="url(#glow-soft)" opacity="0.25">
    <circle cx="650" cy="380" r="130" fill="#0d9488" />
  </g>

  <!-- Background Animated Wave / Metric Lines -->
  <g opacity="0.3">
    <path class="pulse-line" d="M 0 320 Q 300 240 600 300 T 1200 220" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path class="pulse-line" d="M 0 350 Q 320 380 640 280 T 1200 310" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Decorative Tech Graphic (Right Side Dashboard Metric Cards) -->
  <g transform="translate(860, 60)" opacity="0.95">
    <!-- Outer Card Container -->
    <rect x="0" y="0" width="280" height="290" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="38" rx="14" fill="#1e293b" fill-opacity="0.8"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#eab308"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="80" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">CONTRACT VELOCITY</text>

    <!-- Cycle Time Metric Block -->
    <g transform="translate(18, 55)">
      <rect width="244" height="60" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="0.8"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">AVG CYCLE TIME (TAT)</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">14.2 Days</text>
      <text x="155" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981">↓ -38.4%</text>
    </g>

    <!-- Mini Dynamic Bar Chart -->
    <g transform="translate(25, 130)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" font-weight="600">STAGE DURATION &amp; BOTTLENECK ANALYSIS</text>
      
      <!-- Stage Bars -->
      <rect class="metric-bar-1" x="15" y="105" width="28" height="45" rx="4" fill="#0ea5e9"/>
      <rect class="metric-bar-2" x="65" y="75" width="28" height="75" rx="4" fill="#6366f1"/>
      <rect class="metric-bar-3" x="115" y="90" width="28" height="60" rx="4" fill="#10b981"/>
      <rect x="165" y="40" width="28" height="110" rx="4" fill="#f59e0b" opacity="0.9"/>

      <!-- Labels -->
      <text x="22" y="165" font-family="sans-serif" font-size="9" fill="#94a3b8">Draft</text>
      <text x="68" y="165" font-family="sans-serif" font-size="9" fill="#94a3b8">Redline</text>
      <text x="118" y="165" font-family="sans-serif" font-size="9" fill="#94a3b8">Approve</text>
      <text x="175" y="165" font-family="sans-serif" font-size="9" fill="#94a3b8">Sign</text>
    </g>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Badges (Crisp and Unobscured) -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Badge -->
    <g class="badge-glow" transform="translate(0, 0)">
      <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
      <text x="32" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5">LEGALTECH &amp; CLM ANALYTICS</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.8">
      Contract Performance
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#38bdf8" letter-spacing="-0.8">
      &amp; Cycle Time Analytics
    </text>

    <!-- Tagline / Subtitle -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      Curated ecosystem of SaaS &amp; Open-Source BI frameworks for contracting velocity,
    </text>
    <text x="0" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      turnaround time (TAT), stage bottleneck identification, and operational KPI reporting.
    </text>

    <!-- Capability Tags / Pills in Foreground -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="19" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⚡ Turnaround Time</text>

      <rect x="142" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="158" y="19" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🔍 Bottleneck Audit</text>

      <rect x="299" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="315" y="19" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">📊 BI Dashboards</text>

      <rect x="446" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="462" y="19" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🤖 AI Intelligence</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accent-cyan)" />
</svg>
